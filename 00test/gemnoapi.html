<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive JSON Media Manager</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .config-bar { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 800px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .config-bar div { flex: 1; min-width: 200px; }
        label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 800px; }
        .box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #mediaBox { width: 100%; min-height: 250px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 4px; overflow: hidden; }
        img, video { max-width: 100%; max-height: 100%; }
        
        .field-group { margin-bottom: 12px; }
        .hidden { display: none; }
        #status { font-size: 13px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="config-bar">
        <div>
            <label>Google Client ID</label>
            <input type="text" id="clientId" placeholder="Paste Client ID here...">
        </div>
        <div>
            <label>JSON File ID</label>
            <input type="text" id="fileId" placeholder="Paste File ID from User A...">
        </div>
        <button onclick="gapiStart()">Connect & Load</button>
        <div id="status">Status: Waiting for connection...</div>
    </div>

    <div id="appInterface" class="main-container hidden">
        <div class="box">
            <label>Media Preview</label>
            <div id="mediaBox">
                <p style="color: white;">No Media Loaded</p>
            </div>
            <div id="displayMeta" style="margin-top: 15px;">
                <h3 id="viewName" style="margin: 0;"></h3>
                <p id="viewNote" style="color: #666;"></p>
            </div>
        </div>

        <div class="box">
            <label style="font-size: 16px; margin-bottom: 10px;">Record Details</label>
            <div class="field-group">
                <label>Name</label><input type="text" id="inp-name">
            </div>
            <div class="field-group">
                <label>Note</label><textarea id="inp-note"></textarea>
            </div>
            <div class="field-group">
                <label>Media Link (Drive)</label><input type="text" id="inp-media">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="field-group"><label>ID</label><input type="text" id="inp-id"></div>
                <div class="field-group"><label>Date</label><input type="date" id="inp-invdate"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="field-group"><label>Tax</label><input type="number" id="inp-tax"></div>
                <div class="field-group"><label>Total</label><input type="number" id="inp-total"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="field-group"><label>Ship Via</label><input type="text" id="inp-ship_via"></div>
                <div class="field-group" style="padding-top: 25px;">
                    <input type="checkbox" id="inp-closed" style="width: auto;"> <label style="display: inline;">Closed</label>
                </div>
            </div>
            
            <button onclick="saveData()" style="width: 100%; background: #28a745;">Save Changes to Drive</button>
        </div>
    </div>

<script>
    let currentData = {};
    let tokenClient;
    let gapiInited = false;

    // 1. Initialize API Clients
    function gapiStart() {
        const cID = document.getElementById('clientId').value;
        if (!cID) return alert("Please enter a Client ID");
        
        gapi.load('client', async () => {
            await gapi.client.init({
                discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
            });
            gapiInited = true;
            authenticate();
        });
    }

    function authenticate() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: document.getElementById('clientId').value,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (res) => {
                if (res.access_token) {
                    document.getElementById('status').innerText = "Status: Connected!";
                    loadFile();
                }
            }
        });
        tokenClient.requestAccessToken();
    }

    // 2. Load and Map JSON to inputs
    async function loadFile() {
        const fID = document.getElementById('fileId').value;
        try {
            const response = await gapi.client.drive.files.get({ fileId: fID, alt: 'media' });
            currentData = response.result;
            
            // Map JSON to Inputs
            document.getElementById('inp-id').value = currentData.id;
            document.getElementById('inp-invdate').value = currentData.invdate;
            document.getElementById('inp-name').value = currentData.name;
            document.getElementById('inp-note').value = currentData.note;
            document.getElementById('inp-media').value = currentData.media;
            document.getElementById('inp-tax').value = currentData.tax;
            document.getElementById('inp-closed').checked = currentData.closed;
            document.getElementById('inp-ship_via').value = currentData.ship_via;
            document.getElementById('inp-total').value = currentData.total;

            updateMediaDisplay();
            document.getElementById('appInterface').classList.remove('hidden');
        } catch (e) {
            alert("Error loading file. Ensure the ID is correct and you have permission.");
        }
    }

    // 3. Media Viewer Logic
    function updateMediaDisplay() {
        const url = document.getElementById('inp-media').value;
        const box = document.getElementById('mediaBox');
        
        // Convert typical Drive share link to direct stream link
        const fileIdMatch = url.match(/\/d\/([^/]+)/);
        const directUrl = fileIdMatch ? `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}` : url;

        // Visual labels
        document.getElementById('viewName').innerText = document.getElementById('inp-name').value;
        document.getElementById('viewNote').innerText = document.getElementById('inp-note').value;

        if (url.includes('video') || url.toLowerCase().endsWith('.mp4')) {
            box.innerHTML = `<video src="${directUrl}" controls autoplay muted></video>`;
        } else {
            box.innerHTML = `<img src="${directUrl}" onerror="this.src='https://via.placeholder.com/300?text=Invalid+Media+URL'">`;
        }
    }

    // 4. Save Logic
    async function saveData() {
        const fID = document.getElementById('fileId').value;
        
        // Build JSON from Inputs
        const updatedData = {
            id: document.getElementById('inp-id').value,
            invdate: document.getElementById('inp-invdate').value,
            name: document.getElementById('inp-name').value,
            note: document.getElementById('inp-note').value,
            media: document.getElementById('inp-media').value,
            tax: document.getElementById('inp-tax').value,
            closed: document.getElementById('inp-closed').checked,
            ship_via: document.getElementById('inp-ship_via').value,
            total: document.getElementById('inp-total').value
        };

        document.getElementById('status').innerText = "Status: Saving...";

        try {
            await gapi.client.request({
                path: `/upload/drive/v3/files/${fID}`,
                method: 'PATCH',
                params: { uploadType: 'media' },
                body: JSON.stringify(updatedData, null, 2)
            });
            document.getElementById('status').innerText = "Status: Saved Successfully!";
            updateMediaDisplay();
        } catch (e) {
            alert("Save failed. Check permissions.");
            document.getElementById('status').innerText = "Status: Error saving.";
        }
    }
</script>
</body>
</html>
